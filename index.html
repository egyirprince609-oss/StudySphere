<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050816">
  <meta name="description" content="Study Sphere Ai — a personal AI-powered learning space by Code Academy Solution."><meta name="robots" content="index,follow">
  <title>Study Sphere Ai — Learn • Practice • Grow</title><link rel="icon" href="./assets/logo.png" type="image/png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="bg-grid"></div><div class="ambient a"></div><div class="ambient b"></div>
  <main class="splash" aria-label="Study Sphere Ai starting">
    <div class="orb" aria-hidden="true"></div>
    <div class="splash-content">
      <img class="splash-logo" src="./assets/logo.png" alt="Study Sphere Ai 3D neon brain-and-book emblem">
      <h1 class="splash-title">Study Sphere <span class="gradient-text">Ai</span></h1>
      <p class="splash-tagline">LEARN <span>•</span> PRACTICE <span>•</span> GROW</p>
      <div class="loader" role="progressbar" aria-label="Preparing your study space"><span></span></div>
      <p class="splash-status" id="splashStatus" aria-live="polite">Preparing your study space…</p>
    </div>
    <div class="splash-company">A Code Academy Solution product</div>
    <noscript><div style="position:absolute;bottom:60px;text-align:center"><a href="./signup.html">Continue to Study Sphere Ai</a></div></noscript>
  </main>
  <script>
    // Keep a fallback even if the Firebase module CDN is temporarily unavailable.
    window.__studySphereSplashStarted = Date.now();
    window.__studySphereSplashRedirected = false;
    window.__studySphereSplashFallback = setTimeout(() => {
      if (!window.__studySphereSplashRedirected) {
        window.__studySphereSplashRedirected = true;
        location.replace('./signup.html');
      }
    }, 6500);
  </script>
  <script type="module">
    import { auth } from './firebase.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
    const status=document.getElementById('splashStatus');
    const minSplash=1650;
    function route(user){
      if(window.__studySphereSplashRedirected)return;
      window.__studySphereSplashRedirected=true;
      clearTimeout(window.__studySphereSplashFallback);
      const target=!user?'./signup.html':(user.emailVerified?'./dashboard.html':'./email-verification.html');
      status.textContent=user?(user.emailVerified?'Opening your study space…':'Checking your email verification…'):'Opening your learning journey…';
      const elapsed=Date.now()-(window.__studySphereSplashStarted||Date.now());
      setTimeout(()=>location.replace(target),Math.max(0,minSplash-elapsed));
    }
    onAuthStateChanged(auth, route);
  </script>
</body>
</html>
